<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#efe9dd;}
  a{color:#8a5a2b;text-decoration:none;}
  a:hover{color:#5f3c1a;text-decoration:underline;}
  @keyframes pageBendA{0%{transform:skewY(0) scaleX(1);}30%{transform:skewY(-3.2deg) scaleX(0.93) rotateX(3deg);}65%{transform:skewY(1.6deg) scaleX(0.975);}100%{transform:skewY(0) scaleX(1);}}
  @keyframes pageBendB{0%{transform:skewY(0) scaleX(1);}30%{transform:skewY(-3.2deg) scaleX(0.93) rotateX(3deg);}65%{transform:skewY(1.6deg) scaleX(0.975);}100%{transform:skewY(0) scaleX(1);}}
</style>
</helmet>
<div ref="{{ wrapRef }}" data-screen-label="Flipbook Section" style="height:500vh; position:relative; font-family:'Newsreader', Georgia, serif; background:#efe9dd;">
  <div style="position:sticky; top:0; height:100vh; display:flex; align-items:center; justify-content:center; gap:7vw; overflow:hidden; padding:0 6vw; box-sizing:border-box;">
    <div style="max-width:340px; display:flex; flex-direction:column; gap:18px; flex:0 1 auto;">
      <div style="font-family:'Spline Sans Mono', monospace; font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:#8a5a2b;">Chapter {{ pageNum }} / 05</div>
      <h2 style="margin:0; font-size:clamp(34px,3.4vw,52px); line-height:1.05; font-weight:500; color:#231c12; text-wrap:balance;">A story you can leaf through.</h2>
      <p style="margin:0; font-size:17px; line-height:1.55; color:#5d5344; max-width:300px; text-wrap:pretty;">Keep scrolling — each turn of the page reveals the next chapter. Or jump straight to one with the tabs on the edge.</p>
      <div style="font-family:'Spline Sans Mono', monospace; font-size:12px; letter-spacing:0.14em; color:#a3937c; display:flex; align-items:center; gap:10px;">
        <span style="display:inline-block; width:30px; height:1px; background:#a3937c;"></span>
        SCROLL TO TURN
      </div>
    </div>
    <div ref="{{ overlayRef }}" style="position:absolute; inset:0; pointer-events:none; z-index:50;"></div>
    <div ref="{{ bookRef }}" style="position:relative; width:min(480px,42vw); height:min(640px,78vh); perspective:2400px; flex:0 0 auto;">
      <div style="position:absolute; left:-14px; top:6px; bottom:6px; width:14px; background:linear-gradient(90deg, rgba(35,28,18,0) 0%, rgba(35,28,18,0.28) 100%); border-radius:3px 0 0 3px;"></div>
      <sc-for list="{{ pages }}" as="pg" hint-placeholder-count="5">
        <div onClick="{{ pg.onPage }}" style="position:absolute; inset:0; transform-origin:left center; transform-style:preserve-3d; cursor:pointer; transform:{{ pg.transform }}; transition:{{ pg.transition }}; z-index:{{ pg.z }}; opacity:{{ pg.opacity }};">
        <div style="position:absolute; inset:0; transform-style:preserve-3d; transform-origin:left center; animation:{{ pg.bendAnim }};">
          <div style="position:absolute; inset:0; backface-visibility:hidden; background:linear-gradient(105deg, #faf6ec 0%, #f6f0e2 60%, #efe7d4 100%); border-radius:2px 10px 10px 2px; box-shadow:0 18px 40px -18px rgba(35,28,18,0.45), 0 2px 6px rgba(35,28,18,0.12); padding:52px 44px 40px; box-sizing:border-box; display:flex; flex-direction:column; overflow:hidden;">
            <div style="position:absolute; left:0; top:0; bottom:0; width:44px; background:linear-gradient(90deg, rgba(35,28,18,0.14), rgba(35,28,18,0) 100%); pointer-events:none;"></div>
            <div style="font-family:'Spline Sans Mono', monospace; font-size:11px; letter-spacing:0.24em; text-transform:uppercase; color:{{ pg.tabColor }};">{{ pg.kicker }}</div>
            <h3 style="margin:14px 0 0; font-size:34px; line-height:1.08; font-weight:500; color:#231c12; text-wrap:balance;">{{ pg.title }}</h3>
            <div style="display:flex; gap:8px; margin:24px 0 18px;">
              <sc-for list="{{ pg.subTabs }}" as="st" hint-placeholder-count="3">
                <button onClick="{{ st.onClick }}" style-hover="border-color:#8b7d66;" style="font-family:'Spline Sans Mono', monospace; font-size:11px; letter-spacing:0.12em; text-transform:uppercase; padding:7px 14px; border-radius:999px; cursor:pointer; background:{{ st.bg }}; color:{{ st.fg }}; border:1px solid {{ st.bd }}; transition:background 0.25s ease, color 0.25s ease, border-color 0.25s ease;">{{ st.label }}</button>
              </sc-for>
            </div>
            <p style="margin:0; font-size:16.5px; line-height:1.62; color:#4f4638; text-wrap:pretty;">{{ pg.body }}</p>
            <p style="margin:14px 0 0; font-size:16.5px; line-height:1.62; color:#4f4638; font-style:italic; text-wrap:pretty;">{{ pg.aside }}</p>
            <div style="margin-top:auto; display:flex; justify-content:space-between; align-items:center; font-family:'Spline Sans Mono', monospace; font-size:11px; letter-spacing:0.18em; color:#a3937c;">
              <span>EST. 2026</span>
              <span>{{ pg.num }}</span>
            </div>
          </div>
          <div style="position:absolute; inset:0; backface-visibility:hidden; transform:rotateY(180deg); background:#f1ebdc; border-radius:10px 2px 2px 10px; box-shadow:0 12px 30px -16px rgba(35,28,18,0.4);"></div>
          <div onClick="{{ pg.onTab }}" style-hover="transform:translateX(4px);" style="position:absolute; right:-38px; top:{{ pg.tabTop }}; width:38px; height:74px; background:{{ pg.tabColor }}; border-radius:0 8px 8px 0; box-shadow:2px 3px 8px rgba(35,28,18,0.25); display:flex; align-items:center; justify-content:center; writing-mode:vertical-rl; font-family:'Spline Sans Mono', monospace; font-size:10.5px; letter-spacing:0.2em; color:#faf6ec; text-transform:uppercase; transition:transform 0.2s ease; backface-visibility:hidden;">{{ pg.tab }}</div>
        </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;flipMs&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 900, &quot;min&quot;: 400, &quot;max&quot;: 1800, &quot;step&quot;: 50, &quot;unit&quot;: &quot;ms&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Page turn&quot; },
  &quot;clickToFlip&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Page turn&quot; }
}">
class Component extends DCLogic {
  state = { idx: 0, prevIdx: 0, flips: 0 };
  wrapRef = React.createRef();
  bookRef = React.createRef();
  overlayRef = React.createRef();
  flights = new Map();
  componentDidMount() {
    const wait = () => { if (window.THREE) { this.threeOn = true; this.forceUpdate(); } else this._tw = setTimeout(wait, 120); };
    wait();
    this.onScroll = () => {
      const el = this.wrapRef.current;
      if (!el) return;
      const rect = el.getBoundingClientRect();
      const step = window.innerHeight;
      const idx = Math.max(0, Math.min(4, Math.round(-rect.top / step)));
      if (idx !== this.state.idx) {
        const from = this.state.idx;
        this.setState(s => ({ idx, prevIdx: s.idx, flips: s.flips + 1 }));
        this.startFlights(from, idx);
      }
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    clearTimeout(this._tw); cancelAnimationFrame(this._raf);
    if (this.renderer) this.renderer.dispose();
  }
  ensureRenderer() {
    const T = window.THREE, ov = this.overlayRef.current;
    if (!ov) return false;
    const w = ov.clientWidth, h = ov.clientHeight;
    if (!this.renderer) {
      this.renderer = new T.WebGLRenderer({ alpha: true, antialias: true });
      this.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
      this.renderer.domElement.style.cssText = 'position:absolute;inset:0;';
      ov.appendChild(this.renderer.domElement);
      this.scene = new T.Scene();
    }
    this.renderer.setSize(w, h);
    const fov = 2 * Math.atan((h / 2) / 2400) * 180 / Math.PI;
    this.camera = new T.PerspectiveCamera(fov, w / h, 10, 6000);
    this.camera.position.set(0, 0, 2400);
    this.ovSize = { w, h };
    return true;
  }
  drawTex(i, W, H) {
    const T = window.THREE, p = this._data[i];
    const at = (this.state.sub || {})[i] || 0, tb = p.tabs[at];
    const k = 2, c = document.createElement('canvas');
    c.width = W * k; c.height = H * k;
    const x = c.getContext('2d'); x.scale(k, k);
    const g = x.createLinearGradient(0, 0, W, H * 0.3);
    g.addColorStop(0, '#faf6ec'); g.addColorStop(0.6, '#f6f0e2'); g.addColorStop(1, '#efe7d4');
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    const sp = x.createLinearGradient(0, 0, 44, 0);
    sp.addColorStop(0, 'rgba(35,28,18,0.14)'); sp.addColorStop(1, 'rgba(35,28,18,0)');
    x.fillStyle = sp; x.fillRect(0, 0, 44, H);
    const L = 44, R = W - 44; let y = 52;
    x.fillStyle = p.color; x.font = '500 11px "Spline Sans Mono", monospace';
    x.fillText(p.kicker.toUpperCase().split('').join('\u200a\u200a'), L, y + 10); y += 34;
    x.fillStyle = '#231c12'; x.font = '500 34px Newsreader, Georgia, serif';
    y = this.wrapText(x, p.title, L, y + 14, R - L, 37) + 16;
    let px = L;
    x.font = '400 11px "Spline Sans Mono", monospace';
    p.tabs.forEach((t, ti) => {
      const tw = x.measureText(t.label.toUpperCase()).width + 28;
      x.fillStyle = ti === at ? p.color : 'rgba(0,0,0,0)';
      x.strokeStyle = ti === at ? p.color : '#d8cdb8';
      x.beginPath(); x.roundRect(px, y, tw, 28, 14); x.fill(); x.stroke();
      x.fillStyle = ti === at ? '#faf6ec' : '#8b7d66';
      x.fillText(t.label.toUpperCase(), px + 14, y + 18);
      px += tw + 8;
    });
    y += 52;
    x.fillStyle = '#4f4638'; x.font = '400 16.5px Newsreader, Georgia, serif';
    y = this.wrapText(x, tb.body, L, y, R - L, 27) + 18;
    x.font = 'italic 400 16.5px Newsreader, Georgia, serif';
    this.wrapText(x, tb.aside, L, y, R - L, 27);
    x.fillStyle = '#a3937c'; x.font = '400 11px "Spline Sans Mono", monospace';
    x.fillText('EST. 2026', L, H - 42); x.fillText('PAGE 0' + (i + 1), R - 60, H - 42);
    const tex = new T.CanvasTexture(c); tex.anisotropy = 4;
    return tex;
  }
  wrapText(x, text, lx, ly, maxW, lh) {
    const words = text.split(' '); let line = '', y = ly;
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (x.measureText(t).width > maxW && line) { x.fillText(line, lx, y); line = w; y += lh; }
      else line = t;
    }
    if (line) x.fillText(line, lx, y);
    return y;
  }
  startFlights(from, to) {
    if (!this.threeOn || from === to) return;
    const T = window.THREE, book = this.bookRef.current;
    if (!book || !this.ensureRenderer()) return;
    const ov = this.overlayRef.current;
    const bR = book.getBoundingClientRect(), oR = ov.getBoundingClientRect();
    const W = bR.width, H = bR.height;
    const spineX = (bR.left - oR.left) - this.ovSize.w / 2;
    const cenY = this.ovSize.h / 2 - (bR.top - oR.top) - H / 2;
    const dir = to > from, lo = Math.min(from, to), hi = Math.max(from, to);
    const now = performance.now(), dur = this.props.flipMs ?? 900;
    let k = 0;
    for (let i = lo; i < hi; i++) {
      const order = dir ? i : (hi - 1 - (i - lo)) + lo;
      const old = this.flights.get(i);
      let startA = dir ? 0 : Math.PI;
      if (old) { startA = old.curA; this.scene.remove(old.group); old.geo.dispose(); }
      const geo = new T.PlaneGeometry(W, H, 64, 1);
      const base = geo.attributes.position.array.slice();
      const mF = new T.MeshBasicMaterial({ map: this.drawTex(i, W, H), side: T.FrontSide, transparent: true });
      const mB = new T.MeshBasicMaterial({ color: 0xf1ebdc, side: T.BackSide, transparent: true });
      const group = new T.Group();
      group.add(new T.Mesh(geo, mF)); group.add(new T.Mesh(geo, mB));
      group.position.set(spineX, cenY, 1 + i);
      this.scene.add(group);
      this.flights.set(i, { dir, t0: now + (dir ? i - lo : hi - 1 - i) * 70, dur, from: startA, to: dir ? Math.PI : 0, group, geo, base, mF, mB, W, curA: startA });
      k++;
    }
    if (k && !this._raf) this._raf = requestAnimationFrame(this.tick);
  }
  tick = () => {
    const now = performance.now();
    const bend = (this.props.bendDepth ?? 0.45);
    let done = [];
    for (const [i, f] of this.flights) {
      let p = Math.min(1, Math.max(0, (now - f.t0) / f.dur));
      const e = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
      const a = f.from + (f.to - f.from) * e;
      f.curA = a;
      const curl = bend * Math.sin(Math.PI * e);
      const pos = f.geo.attributes.position;
      for (let j = 0; j < pos.count; j++) {
        const x0 = f.base[j * 3] + f.W / 2;
        const va = a + curl * Math.sin(Math.PI * x0 / f.W) * (f.dir ? 1 : -1);
        pos.setX(j, x0 * Math.cos(va));
        pos.setZ(j, x0 * Math.sin(va));
      }
      pos.needsUpdate = true;
      const op = f.dir ? (p > 0.72 ? 1 - (p - 0.72) / 0.28 : 1) : (p < 0.22 ? p / 0.22 : 1);
      f.mF.opacity = op; f.mB.opacity = op;
      if (p >= 1) done.push(i);
    }
    this.renderer.render(this.scene, this.camera);
    for (const i of done) {
      const f = this.flights.get(i);
      this.scene.remove(f.group); f.geo.dispose(); f.mF.map.dispose(); f.mF.dispose(); f.mB.dispose();
      this.flights.delete(i);
    }
    if (done.length) this.forceUpdate();
    if (this.flights.size) this._raf = requestAnimationFrame(this.tick);
    else { this._raf = 0; this.renderer.render(this.scene, this.camera); }
  }
  goTo(i) {
    const el = this.wrapRef.current;
    if (!el) return;
    const top = window.scrollY + el.getBoundingClientRect().top + i * window.innerHeight;
    window.scrollTo({ top, behavior: 'smooth' });
  }
  renderVals() {
    const d = this.props.flipMs ?? 900;
    const clickToFlip = this.props.clickToFlip ?? true;
    const data = [
      { tab: 'Intro', kicker: 'Chapter One', title: 'It starts with a blank page.', color: '#8a5a2b', tabs: [
        { label: 'Story', body: 'Every good site tells a story, and this one reads like a book. Scroll down and watch the page peel away, just like a real flipbook.', aside: 'No plugins, no video — just paper, light, and a little patience.' },
        { label: 'Why', body: 'Because scrolling past things is forgettable, and turning a page is not. A flipbook slows the reader down just enough to make them look.', aside: 'Attention is the rarest currency on the web.' },
        { label: 'How', body: 'Pure CSS 3D — each sheet rotates around the spine while a keyframe bends it mid-turn. Your scroll position decides which page is open.', aside: 'It works on any modern browser, phones included.' },
      ] },
      { tab: 'About', kicker: 'Chapter Two', title: 'Who we are, in one page.', color: '#5b6d4f', tabs: [
        { label: 'Studio', body: 'A small studio with a big fondness for tactile things. We build digital work that feels like it has weight — pages you want to touch, corners you want to fold.', aside: 'Founded over coffee. Still mostly runs on it.' },
        { label: 'Team', body: 'Four people, three time zones, one shared library of type specimens. Designers who code and coders who kern.', aside: 'We argue about serifs so you never have to.' },
        { label: 'Values', body: 'Craft over volume. Ship fewer, better things. Leave every page nicer than the template we found it on.', aside: 'The details are not the details — they are the design.' },
      ] },
      { tab: 'Work', kicker: 'Chapter Three', title: 'Things we have made.', color: '#a4552f', tabs: [
        { label: 'Editorial', body: 'Editorial sites, digital catalogues, lookbooks, and annual reports that people actually finish reading. Each one designed to be turned, not scrolled past.', aside: 'The best compliment we get: "I read the whole thing."' },
        { label: 'Brands', body: 'Identity systems for shops, studios, and stubborn founders — wordmarks, palettes, and the rules that keep them honest.', aside: 'A brand is a promise repeated consistently.' },
        { label: 'Sites', body: 'Marketing pages, product tours, and micro-sites with just enough motion to feel alive and never enough to feel busy.', aside: 'Fast to load, slow to forget.' },
      ] },
      { tab: 'Process', kicker: 'Chapter Four', title: 'How a page comes to be.', color: '#3f5a6b', tabs: [
        { label: 'Sketch', body: 'We sketch on paper first, always. Then structure, then type, then motion — in that order. The flip you are watching now was drawn before it was coded.', aside: 'Slow is smooth, and smooth is fast.' },
        { label: 'Build', body: 'Design and build happen in the same room, on the same day. What you review is always the real thing, never a picture of it.', aside: 'Prototypes over promises.' },
        { label: 'Polish', body: 'The last ten percent takes half the time: easing curves, shadows, kerning, load order. That is where the flip starts to feel like paper.', aside: 'Done is when it feels inevitable.' },
      ] },
      { tab: 'Contact', kicker: 'Chapter Five', title: 'Write us a letter.', color: '#7a4a5e', tabs: [
        { label: 'Say hi', body: 'The last page is always an invitation. Tell us about the story you want to tell, and we will help you put it on paper — the digital kind.', aside: 'hello@yourstudio.com — we reply within a day.' },
        { label: 'Visit', body: 'Studio 4, The Old Bindery. Come by on a Friday afternoon — the espresso machine is on and the bookshelf is fair game.', aside: 'Open Mon–Fri, 9 to 6.' },
        { label: 'Follow', body: 'We publish one page a month: a teardown of something well-made, printed and mailed to whoever asks.', aside: 'Paper newsletter. Obviously.' },
      ] },
    ];
    this._data = data;
    const N = data.length;
    const { idx, prevIdx, flips } = this.state;
    const lo = Math.min(idx, prevIdx), hi = Math.max(idx, prevIdx);
    const bendName = flips % 2 ? 'pageBendA' : 'pageBendB';
    const pages = data.map((p, i) => {
      const flipped = i < idx;
      const turning = !this.threeOn && flips > 0 && i >= lo && i < hi;
      const flying = this.threeOn && this.flights.has(i);
      const at = (this.state.sub || {})[i] || 0;
      const active = p.tabs[at];
      return {
        body: active.body,
        aside: active.aside,
        subTabs: p.tabs.map((t, ti) => ({
          label: t.label,
          bg: ti === at ? p.color : 'transparent',
          fg: ti === at ? '#faf6ec' : '#8b7d66',
          bd: ti === at ? p.color : '#d8cdb8',
          onClick: (e) => { e.stopPropagation(); this.setState(s => ({ sub: { ...(s.sub || {}), [i]: ti } })); },
        })),
        bendAnim: turning ? `${bendName} ${d}ms cubic-bezier(.4,.1,.3,1)` : 'none',
        ...p,
        num: 'PAGE 0' + (i + 1),
        tabColor: p.color,
        tabTop: (36 + i * 96) + 'px',
        transform: flipped ? 'rotateY(-180deg)' : 'rotateY(0deg)',
        opacity: (flipped || flying) ? 0 : 1,
        transition: this.threeOn ? 'none' : (flipped
          ? `transform ${d}ms cubic-bezier(.35,.1,.22,1), opacity ${Math.round(d * 0.35)}ms ease ${Math.round(d * 0.55)}ms`
          : `transform ${d}ms cubic-bezier(.35,.1,.22,1), opacity ${Math.round(d * 0.3)}ms ease`),
        z: flipped ? 2 * N - i : N - i,
        onTab: (e) => { e.stopPropagation(); this.goTo(i); },
        onPage: () => { if (clickToFlip) this.goTo(Math.min(N - 1, idx + 1)); },
      };
    });
    return { pages, wrapRef: this.wrapRef, bookRef: this.bookRef, overlayRef: this.overlayRef, pageNum: '0' + (idx + 1) };
  }
}
</script>
</body>
</html>
